version: '3.8'

services:
  quantum-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.quantum
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    volumes:
      - ../config:/app/config:ro
      - quantum-logs:/app/logs

  simulator:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # Add load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - quantum-core
      - dashboard

volumes:
  quantum-logs:
